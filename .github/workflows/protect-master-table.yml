# data/post_mt_systems.json is generated by code/data_processing/Combine_and_process_data.py
# and must never be edited directly: the next pipeline rerun would overwrite the edits.
# This check fails external PRs that touch it and points contributors to the
# proposed_additions workflow instead. (Requires branch protection with this
# check marked as required to actually block merging.)
name: Protect master catalog table

on:
  pull_request:
    paths:
      - 'data/post_mt_systems.json'

jobs:
  block-direct-edits:
    if: github.event.pull_request.author_association != 'OWNER' && github.event.pull_request.author_association != 'MEMBER'
    runs-on: ubuntu-latest
    steps:
      - name: Explain and fail
        run: |
          echo "::error::data/post_mt_systems.json is auto-generated and must not be edited directly. Please submit systems via the missing-system workflow (https://binary-observations.github.io/post_mt_catalog/missing_systems.html), which adds files under data/proposed_additions/ instead."
          exit 1
